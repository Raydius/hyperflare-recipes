[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperflare-recipes"
version = "0.1.0"
description = "Official model recipes and reusable b12x model components for Flare/Helios"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "hyperflare_recipes/recipes/deepseek41/assets/LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ignition[prepare]",
]

[project.scripts]
ignition = "hyperflare_recipes.cli:main"

[project.optional-dependencies]
test = ["pytest>=9,<10", "tiktoken>=0.12,<1"]
api-test = ["pytest>=9,<10", "openai>=2,<3", "anthropic>=0.70,<1"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
# The fork's FlashInfer replaces the one core ignition sources (upstream's main) for the whole environment.
override-dependencies = [
    "flashinfer-python[b12x] @ git+https://github.com/Raydius/flashinfer.git@d73da5c49b0f073cc78a3f30867a7f4b7cfbc030",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
# The fork builds on the core fork's deploy at an exact commit; FORK.md in that repository bumps it after each move.
ignition = { git = "https://github.com/Raydius/flare-local-inference.git", rev = "6f910ba3d150c9197281747a163483d29ad644a2" }

[tool.setuptools.packages.find]
include = ["hyperflare_recipes*"]

[tool.setuptools.package-data]
"hyperflare_recipes.recipes.deepseek41" = ["assets/*"]
"hyperflare_recipes.recipes.deepseek4" = ["assets/*"]
"hyperflare_recipes.recipes.gemma4" = ["assets/*"]
"hyperflare_recipes.recipes.kimi3" = ["assets/*"]
"hyperflare_recipes.recipes.kimi31" = ["assets/*"]
"hyperflare_recipes.recipes.glm53" = ["assets/*"]
"hyperflare_recipes.recipes.mimo_v2" = ["assets/*"]
"hyperflare_recipes.recipes.nemotron_h" = ["assets/*"]
"hyperflare_recipes.recipes.qwen38" = ["assets/*"]
"hyperflare_recipes.recipes.step5" = ["assets/*"]
"hyperflare_recipes.recipes.muse_spark" = ["assets/*"]
"hyperflare_recipes.recipes.minimax_m3" = ["assets/*"]
"hyperflare_recipes.recipes.muse_glimmer_nvfp4" = ["assets/*"]
"hyperflare_recipes.recipes.elephant1" = ["assets/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
